name: build
on: [push, workflow_dispatch]
jobs:
  watch:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: xcodebuild -project ClaudeWatch.xcodeproj -scheme ClaudeWatch -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
