name: build
on: [push, workflow_dispatch]
jobs:
  watch:
    runs-on: xcode-27
    steps:
      - name: Use the newest Xcode (App Store needs the iOS 27 SDK)
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      - run: xcodebuild -project ClaudeWatch.xcodeproj -scheme ClaudeWatch -destination 'generic/platform=watchOS Simulator' CODE_SIGNING_ALLOWED=NO build
