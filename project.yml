name: ClaudeWatch
options:
  bundleIdPrefix: au.com.strapify
  deploymentTarget: { watchOS: "10.0" }
targets:
  ClaudeWatch:
    type: application
    platform: watchOS
    sources: [ClaudeWatch]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: au.com.strapify.claudewatch
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Claude Watch
      INFOPLIST_KEY_WKApplication: YES
      INFOPLIST_KEY_WKWatchOnly: YES
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: "5.9"
