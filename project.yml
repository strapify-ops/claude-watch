# XcodeGen spec. CI: brew install xcodegen && xcodegen generate
name: ClaudeWatch
options:
  bundleIdPrefix: au.com.strapify
  deploymentTarget:
    iOS: "18.0"
    watchOS: "10.0"
settingGroups:
  common:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  # The App Store only takes a watch-only app inside an iPhone container. It has no code and
  # installs nothing on the iPhone; it carries the watch app (same layout as PickleScore).
  ClaudeWatchContainer:
    type: application.watchapp2-container
    platform: iOS
    dependencies:
      - target: ClaudeWatch
    info:
      path: Config/Container-Info.plist
      properties:
        CFBundleDisplayName: Claude Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
    settings:
      groups: [common]
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: au.com.strapify.claudewatch
        PRODUCT_NAME: ClaudeWatch
        PROVISIONING_PROFILE_SPECIFIER: $(CW_PROFILE_APP)

  ClaudeWatch:
    type: application
    platform: watchOS
    sources: [ClaudeWatch, Shared]
    dependencies:
      - target: ClaudeWatchWidgets
    entitlements:
      path: Config/ClaudeWatch.entitlements
      properties:
        aps-environment: production   # TestFlight / App Store builds use production APNs
        keychain-access-groups:
          - $(AppIdentifierPrefix)au.com.strapify.claudewatch.shared
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Claude Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      groups: [common]
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: au.com.strapify.claudewatch.watchkitapp
        PRODUCT_NAME: ClaudeWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(CW_PROFILE_WATCH)

  # Watch-face complication: sessions waiting / working / ready.
  ClaudeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [Widgets, Shared]
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Claude Watch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)au.com.strapify.claudewatch.shared
    settings:
      groups: [common]
      base:
        TARGETED_DEVICE_FAMILY: "4"
        PRODUCT_BUNDLE_IDENTIFIER: au.com.strapify.claudewatch.watchkitapp.widgets
        PRODUCT_NAME: ClaudeWatchWidgets
        SKIP_INSTALL: YES
        PROVISIONING_PROFILE_SPECIFIER: $(CW_PROFILE_WIDGETS)

schemes:
  ClaudeWatch:
    build:
      targets:
        ClaudeWatch: all
  # The App Store / TestFlight archive: the iPhone container carrying the watch app.
  ClaudeWatchContainer:
    build:
      targets:
        ClaudeWatchContainer: all
    archive:
      config: Release
